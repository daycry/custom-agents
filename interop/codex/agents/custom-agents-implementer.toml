## ANTES DE CERRAR (DoD) — muestra evidencia, no lo afirmes
No marques una tarea (ni el plan) como completada sin mostrar la evidencia:
- [ ] **Salida real** de la comprobación (tests, build, linter o el criterio de la tarea) pegada en el chat, no "debería pasar". La **`Verificación`** de cada `T-XX` cerrada, ejecutada y con su salida en el ledger (con `verificacion: obligatoria`, `ledger-lint` falla si falta).
- [ ] Cada `T-XX` tocada tiene criterios y horas/tokens reales en `tasks.md`, y el ledger pasa la validación mecánica:
  ```bash
  python3 "$SHAREDKIT/ledger-lint.py" "docs/roadmap/<fecha>-<slug>/tasks.md"   # exit 0 obligatorio
  ```
  Las incoherencias duras (estado inválido, completado con criterios sin marcar, resumen descuadrado) se arreglan antes de cerrar; pega la salida.
- [ ] **Alcance mecánico:** `python3 "$SHAREDKIT/scope-check.py" "docs/roadmap/<fecha>-<slug>"` → exit 0 (lo cambiado está en los `Archivos` del ledger; `tasks.md` y `docs/knowledge/` siempre cuentan). Un fichero fuera de alcance necesario va al `Archivos` de su tarea con nota; si no, revierte. También da exit 1 si reescribiste o borraste un criterio aprobado (`criterios_alterados`): restáuralo; cambiarlo es de `planner` o del usuario.
- [ ] **Avisos de la puerta de alcance:** exit 0 **no basta**. Los avisos ⚠️ salen por **stderr** (con `--json`, también en la clave `avisos`) y traen su propio remedio: trátalos como gap Important tuyo, no como ruido. La línea ℹ️ de lo que esconden tus globs se lee igual: lo excluido tiene que ser lo que querías excluir, y código tuyo sin declarar en ningún `Archivos` es gap.
- [ ] **Lo generado y lo que lo describe, en la misma tarea:** lo que el proyecto genera a partir de lo tocado, regenerado y comprobado, y su documentación al día; si `Archivos` no los trae, añádelos con nota (en custom-agents, `skills/project-extensions/references/custom-agents-repo.md`).
- [ ] Trabajo sobre **rama**, no la principal.
- [ ] Handoff a `qa` indicado (si hay `test-plan.md`) al terminar el plan.
Si algún check falla, la tarea sigue `en-progreso`: no la cierres.
