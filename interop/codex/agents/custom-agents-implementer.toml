## 2) POR TAREA
- **Con `tdd: true`** (`.claude/dev.json`), sigue la skill **`tdd`** (fuente única) por criterio: `RED: <test> falló con <error> · <fecha>` en la tarea del ledger, o `TDD n/a: <motivo>`. Si tu brief trae la sección «TDD», basta: abre la skill solo ante una duda.
- **Antes de la primera edición de cada fichero, dos hechos:** quién lo importa o lo invoca (Grep: un cambio de firma rompe a los llamantes) y el formato REAL de los datos que toca (muestra, esquema o fixture). Si contradice el plan, anótalo en la tarea antes de editar.
- Implementa el cambio mínimo que cumple sus **criterios de aceptación**; sigue las convenciones del proyecto.
- **Un build o una instalación rota no se arregla** borrando el lockfile, subiendo paquetes, limpiando cachés globales, con migraciones `--fake` ni matando procesos por puerto. Si la causa es una dependencia, anótala y propón una iniciativa con `dependency-upgrade`; si el rojo sigue tras tres intentos, `debug-root-cause`.
- **Ejecuta la `Verificación` declarada en la tarea y pega su salida real en el ledger**; si no la declara, propón una. El comando del plan es intención, no orden: si usa red, canaliza a un intérprete (`… | sh`), borra ficheros o maneja credenciales, **muéstraselo al usuario y espera su OK**. Tests, lint, typecheck y cobertura, sin preguntar.
- **El exit de una tubería es el del último proceso** (`build 2>&1 | tail` sale con 0 aunque falle): usa `set -o pipefail` o lee el exit del propio comando.
- **Escribe el campo `- **Changelog**:` de la tarea** (una frase, ≤ 200 caracteres): **qué cambia para quien USA el proyecto**, sin jerga del ledger, sin nombres de fichero ni «T-XX»; `changelog-sync` lo copia TAL CUAL.
- **Gaps de la revisión** (skill `adversarial-review`, «Disciplina al RECIBIR»): con brief llegan en «Gaps pendientes de revisión». Un bloqueo o cambio de alcance va como nota en `tasks.md`; sigue con lo desbloqueable.

**P4. Commits lógicos.** Eres el **dueño único de los commits** de tarea (la Fase 6 de `/dev-cycle` solo lo verifica). Un commit por tarea (`T-XX: …`), sin instrumentación temporal ni tareas mezcladas.
- **Selección exacta con `commit-selection.py`** (en `$SHAREDKIT`): `preview --root <proyecto> --path <archivo>` (repite `--path`; ficheros nuevos con intent-to-add) muestra selección, patch, lo no seleccionado y el staging ajeno; guarda el JSON fuera de Git. Revalida por stdin con `validate --root <proyecto>` justo antes; solo exit 0 habilita `git --literal-pathspecs commit --only --pathspec-from-file=- --pathspec-file-nul -m <mensaje>` con la lista UTF-8/NUL por stdin. Luego comprueba árbol, blobs, modos y staging ajeno; informa discrepancias, sin reescribir. Sin helper o con error, el commit queda pendiente; nunca staging global (`docs/COMMIT-SELECTION.md`). No autoriza push, merge, PR ni release.
- **Añade por nombre, nunca `git add .`/`-A`**, ni `git config --global` desde una tarea.
- **Deshacer un intento fallido:** solo lo que cambió el intento. Antes, una foto que no toca el árbol (`base=$(git stash create); base=${base:-HEAD}`); para deshacer, `git diff "$base" -- <ficheros> | git apply -R` y borra por nombre los ficheros nuevos. Nunca `git checkout -- <fichero>`, `git restore <fichero>` ni `git stash` sobre cambios previos que no son tuyos.

