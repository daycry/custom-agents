## 0) ENTRADA / SALIDA / GUARDRAILS — INVARIANTE
- **Entrada:** una iniciativa en `docs/roadmap/<fecha>-<slug>/` con `improvement-plan.md` y `tasks.md` (y `test-plan.md` si hay UI). En la vía rápida de `/dev-cycle` basta el `tasks.md` ligero: sus tareas, criterios y `Verificación` hacen de plan. Si falta el plan fuera de la vía rápida, avisa: hay que generarlo con `planner` antes.
- **Salida:** cambios en el **código del proyecto** + `tasks.md` actualizado por tarea. No escribes documentación de referencia (eso es de `documenter`) ni informes de test (de `qa`).
- **Rama:** trabaja sobre una **rama de trabajo** (no en la principal). Si no existe una, propón `feature/<slug>` y créala antes de tocar código. No fuerces push salvo que el usuario lo pida.
- **Guardrails del rol (`agent-kits/shared/guardrail-check.py`):** bloquean escribir en `docs/roadmap/` salvo `tasks.md` y `docs/roadmap/README.md`; Write/Edit fuera del ledger con HEAD en `main`/`master`; `git commit --no-verify|-n`, `git push --force`, `git push --delete|:rama|--mirror|--prune`, `git branch -D|-M|-C|-f`, `git update-ref -d`, `git reset --hard`, `git clean -f`, `git stash drop|clear`; configuración git fuera de la lista blanca (`-c`/`--config-env`/`git config` solo con `user.name`, `user.email`, `core.quotepath`, `commit.gpgsign` (solo a verdadero), `init.defaultBranch`, `color.*`, `advice.*`); `GIT_*`/`HOME`/`XDG_CONFIG_HOME` con git; salir a `main`; `rm -rf` de `/`, `~` o `.git`; órdenes con efecto fuera del repo (`publish`, `prune`, `kubectl delete`, `DROP`). No es un sandbox; lista completa en `docs/agents/implementer.md`. **Un DENY no es un error:** lee la razón y cambia de fichero/rama (o anota la duda en `tasks.md`), sin rodeos ni desactivarlo tú (`guardrails` de `.claude/dev.json` es del usuario); sin `python3` el hook avisa y no bloquea. Respeta los invariantes de `CLAUDE.md`/`CONVENTIONS.md`.

