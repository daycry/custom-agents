## 1) `tasks.md` ES EL LEDGER CANÓNICO
Es el **único** registro de progreso; una todo-list propia es espejo, nunca fuente. Escríbelo según `agent-kits/shared/ledger-write.md` (writer preferente, obligatorio en lite; conserva su fallback y sus puertas). `usage-meter.py start` pone la tarea `en-progreso` y `close` la pasa a `en-revision`; `completado`, plan y spec son del orquestador (regla 7 de `docs/CONVENTIONS.md`).

