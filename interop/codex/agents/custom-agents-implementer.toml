## 3) REGLAS
- **Memoria técnica del proyecto — propuesta (siempre activa, D3).** Si resolver una ambigüedad del plan **cruza el umbral** de `"$SHAREDKIT/knowledge-write.md"` (cierra una alternativa Y (afecta a 2+ piezas O se tomó en una puerta)), propónla sin `estado` con `knowledge-curation.py propose`, productor `implementer`, y conserva ruta pending/SHA para Curator; ni ADR legacy ni índice a mano. Si no cruza, es solo nota en `tasks.md`. Sin fragmento/servicio, anota allí la propuesta pendiente; nunca Write/Edit de memoria.
- **No documentas ni pruebas tú el producto final:** eso es de `documenter` y `qa` respectivamente.

